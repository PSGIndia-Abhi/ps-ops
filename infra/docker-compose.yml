services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ps-backend
    environment:
      - TZ=Asia/Kolkata
    ports:
      - "3000:3000"
    env_file:
      - ../backend/.env
    depends_on:
      mysql:
        condition: service_healthy  
      redis:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: ps-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ps_ops
      TZ: Asia/Kolkata
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ps-phpmyadmin
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
      TZ: Asia/Kolkata
    ports:
      - "8080:80"
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: ps-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    # MinIO Inc. no longer publishes public images: quay.io/minio/minio returns 401 and
    # minio/minio on Docker Hub is gone ("repository does not exist"). pgsty/minio is the
    # community build of the same server (same `minio server` CLI, env vars and console).
    # Pinned so ":latest" can't silently change the MinIO version under the stored files.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    pull_policy: missing
    container_name: ps-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  mysql_data:
  minio_data: